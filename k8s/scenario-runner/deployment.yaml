# -----------------------------------------------------------------------------
# scenario-runner: in-cluster fault agent.
#
# The Service is an INTERNAL load balancer. The runner can change deployments
# and secrets in this namespace, so it must never be reachable from the
# Internet — only from the Scenario Controller on the App VM over the VNet.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-runner
  namespace: sre-demo
  labels:
    app: scenario-runner
    project: azure-sre-agent-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: scenario-runner
  template:
    metadata:
      labels:
        app: scenario-runner
        project: azure-sre-agent-demo
    spec:
      serviceAccountName: scenario-runner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # The runner must stay schedulable during scenario 02, otherwise the reset
      # path would be broken by the very fault it has to clear.
      priorityClassName: system-cluster-critical
      containers:
        - name: scenario-runner
          image: __SCENARIO_RUNNER_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: K8S_NAMESPACE
              value: sre-demo
            - name: MAGIC8BALL_STABLE_IMAGE
              value: "__MAGIC8BALL_STABLE_IMAGE__"
            - name: MAGIC8BALL_BAD_IMAGE
              value: "__MAGIC8BALL_BAD_IMAGE__"
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scenario-runner-auth
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 4
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: scenario-runner
  namespace: sre-demo
  labels:
    app: scenario-runner
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: scenario-runner
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
